name: Bug report
description: Something in this repository doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For a problem with one of our paid APIs (plans, keys, results), please use the [contact page](https://hybridforgelab.com/contact.html) instead. Security issues: email hybridforgelab@gmail.com, never a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit you're using (for the Home Assistant integration, also your Home Assistant version).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any API keys, tokens or personal data first.
      render: text
